# Netlify build config for the web dashboard (lives in /web).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"          # relative to base ("web/dist")

# SPA fallback so client-side routes (e.g. /shop/gateway) resolve on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
